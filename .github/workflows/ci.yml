name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the exact release.
      # No setup-python: uv reads .python-version and installs that interpreter.
      - uses: astral-sh/setup-uv@v10.3.2
      # --locked: fail if uv.lock is missing or out of date with pyproject.toml
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Same command as locally, incl. the 100% tool-coverage gate.
      - run: make test
      # Integration tests use the real embedding model (~470 MB); cache the download.
      # The model name lives in config.py, so changing it busts the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/shop_ops_agent/config.py') }}
          # Any config.py edit misses the exact key; still start from the newest cached model.
          restore-keys: hf-
      - run: uv run pytest tests/integration -q

  evals:
    # Real-LLM evals, main only. Disabled until the eval runner (#8) exists: set repo
    # variable LIVE_EVALS_ENABLED=true and secret OPENAI_API_KEY to turn it on.
    # The score threshold that fails the build arrives with #9.
    if: github.ref == 'refs/heads/main' && vars.LIVE_EVALS_ENABLED == 'true'
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_EVALS: "1"
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --all-extras --locked
      - run: uv run pytest tests/evals -q

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shop-ops-agent .
      - name: Image size < 1.5 GB (compressed)
        # `docker image inspect .Size` is compressed on the containerd store but unpacked on
        # the classic one, so measure explicitly. gzip -1 compresses less than a registry
        # does, so this errs on the large side.
        # shell: bash adds pipefail; without it a failing `docker save` gives size=20 and passes.
        shell: bash
        run: |
          size=$(docker save shop-ops-agent | gzip -1 | wc -c)
          unpacked=$(docker run --rm --user 0 --entrypoint du shop-ops-agent -sxb / | cut -f1)
          echo "Compressed: $((size / 1000 / 1000)) MB, unpacked: $((unpacked / 1000 / 1000)) MB"
          test "$size" -gt 1000000
          test "$size" -lt 1500000000
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8000:8000 shop-ops-agent
          for _ in $(seq 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
