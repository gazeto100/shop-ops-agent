name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --locked: fail if uv.lock is missing or out of date with pyproject.toml
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit -q

  evals:
    # Runs real-LLM evals only on main (needs secret). Gate: fails if score < threshold.
    # Off until the eval runner (#8) exists: set repo variable LIVE_EVALS_ENABLED=true
    # and secret OPENAI_API_KEY to turn it on.
    if: github.ref == 'refs/heads/main' && vars.LIVE_EVALS_ENABLED == 'true'
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_EVALS: "1"
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --locked
      - run: uv run pytest tests/evals -q

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shop-ops-agent .
