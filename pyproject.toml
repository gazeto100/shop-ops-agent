[project]
name = "shop-ops-agent"
version = "0.1.0"
description = "AI operations agent for a small e-commerce store (RAG + tools + evals)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "chromadb>=1.5",
  "sentence-transformers>=6.0",
  "numpy>=2.5",
  # Direct dep only so [tool.uv.sources] can route it to the CPU-only build (see below)
  "torch>=2.14",
  "rank-bm25>=0.2.2",
  "openai>=3.37",
  "anthropic>=2.1",
  "langfuse>=2.50",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest-cov>=7.1.0",
]

# Linux PyPI torch bundles CUDA (~3 GB of wheels). Embeddings run on CPU, so use the
# CPU-only build there; Windows/macOS PyPI wheels are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_ops_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# RUF001-003: Bulgarian strings are expected; do not flag Cyrillic as "ambiguous"
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# rank-bm25 ships no type hints; retriever.py wraps its scores in a typed numpy array.
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
